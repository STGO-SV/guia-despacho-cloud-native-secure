spring.application.name=guia-despacho

spring.datasource.url=${DB_URL:jdbc:h2:mem:guiadespacho;MODE=Oracle;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

app.storage.efs-path=${APP_EFS_PATH:./efs/guias}
app.aws.s3.bucket=${AWS_S3_BUCKET:guia-despacho-bucket}
app.aws.region=${AWS_REGION:us-east-1}
app.aws.s3.auto-upload=${AWS_S3_AUTO_UPLOAD:false}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}
app.security.jwk-set-uri=${AZURE_JWK_SET_URI}
app.security.audience=${AZURE_CLIENT_ID}
app.security.roles-claim=${AZURE_ROLES_CLAIM:extension_RolGuia}
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false
app.rabbit.exchange=${RABBITMQ_EXCHANGE:guia.exchange}
app.rabbit.main-queue=${RABBITMQ_MAIN_QUEUE:guia.procesamiento.queue}
app.rabbit.error-queue=${RABBITMQ_ERROR_QUEUE:guia.error.queue}
app.rabbit.created-routing-key=${RABBITMQ_CREATED_ROUTING_KEY:guia.creada}
app.rabbit.error-routing-key=${RABBITMQ_ERROR_ROUTING_KEY:guia.error}
app.rabbit.error-simulation-enabled=${RABBITMQ_ERROR_SIMULATION_ENABLED:false}
app.rabbit.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
app.rabbit.retry.initial-interval=${RABBITMQ_RETRY_INITIAL_INTERVAL:1000}
app.rabbit.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER:2.0}
app.rabbit.retry.max-interval=${RABBITMQ_RETRY_MAX_INTERVAL:5000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=${RABBITMQ_HEALTH_ENABLED:true}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
