name: Build and Deploy

on:
  push:
    branches:
      - eft-cursos

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/guia-despacho:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/guia-despacho:latest
            docker stop guia-despacho || true
            docker rm guia-despacho || true
            docker run -d \
              --name guia-despacho \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /opt/guia-despacho/app.env \
              --health-cmd='curl --fail --silent http://localhost:8080/actuator/health || exit 1' \
              --health-interval=15s \
              --health-retries=10 \
              --health-start-period=30s \
              -v /mnt/efs/guias:/mnt/efs/guias \
              ${{ secrets.DOCKERHUB_USERNAME }}/guia-despacho:latest
