services:
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: guia-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [guia-network]

  app:
    build: .
    container_name: guia-despacho-app
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DB_URL: jdbc:h2:file:/app/data/guiadespacho;MODE=Oracle;AUTO_SERVER=FALSE
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_DRIVER: ${DB_DRIVER:-org.h2.Driver}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
      RABBITMQ_ERROR_SIMULATION_ENABLED: ${RABBITMQ_ERROR_SIMULATION_ENABLED:-false}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:?Defina AZURE_ISSUER_URI en .env}
      AZURE_JWK_SET_URI: ${AZURE_JWK_SET_URI:?Defina AZURE_JWK_SET_URI en .env}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?Defina AZURE_CLIENT_ID en .env}
      AZURE_ROLES_CLAIM: ${AZURE_ROLES_CLAIM:-extension_RolGuia}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${AWS_REGION:-us-east-1}}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?Defina AWS_S3_BUCKET en .env}
      AWS_S3_AUTO_UPLOAD: ${AWS_S3_AUTO_UPLOAD:-false}
      APP_EFS_PATH: /app/efs/guias
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
      - app-efs:/app/efs/guias
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [guia-network]

networks:
  guia-network:
    driver: bridge

volumes:
  rabbit-data:
  app-data:
  app-efs:
