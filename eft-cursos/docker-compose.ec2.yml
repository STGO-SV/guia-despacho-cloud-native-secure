name: eft-cursos

x-common-security: &common-security
  AZURE_ISSUER_URI: "${AZURE_ISSUER_URI:?Defina AZURE_ISSUER_URI en .env.ec2}"
  AZURE_JWK_SET_URI: "${AZURE_JWK_SET_URI:?Defina AZURE_JWK_SET_URI en .env.ec2}"
  AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:?Defina AZURE_CLIENT_ID en .env.ec2}"
  AZURE_ROLES_CLAIM: "${AZURE_ROLES_CLAIM:-extension_RolGuia}"
  APP_SECURITY_DEMO_ENABLED: "false"

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME en .env.ec2}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env.ec2}"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [eft-network]

  cursos-service:
    image: "${DOCKERHUB_USERNAME:?Defina DOCKERHUB_USERNAME en .env.ec2}/eft-cursos-cursos:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    environment:
      <<: *common-security
      DB_URL: "${CURSOS_DB_URL:-jdbc:h2:file:/data/cursos}"
      DB_USERNAME: "${CURSOS_DB_USERNAME:-sa}"
      DB_PASSWORD: "${CURSOS_DB_PASSWORD:?Defina CURSOS_DB_PASSWORD en .env.ec2}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-eft-cursos-materiales-demo}"
      AWS_S3_UPLOAD_ENABLED: "false"
    expose: ["8081"]
    volumes:
      - cursos-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [eft-network]

  inscripciones-service:
    image: "${DOCKERHUB_USERNAME:?Defina DOCKERHUB_USERNAME en .env.ec2}/eft-cursos-inscripciones:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *common-security
      DB_URL: "${INSCRIPCIONES_DB_URL:-jdbc:h2:file:/data/inscripciones}"
      DB_USERNAME: "${INSCRIPCIONES_DB_USERNAME:-sa}"
      DB_PASSWORD: "${INSCRIPCIONES_DB_PASSWORD:?Defina INSCRIPCIONES_DB_PASSWORD en .env.ec2}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME en .env.ec2}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env.ec2}"
      RABBITMQ_LISTENER_AUTO_STARTUP: "${RABBITMQ_LISTENER_AUTO_STARTUP:-true}"
      AWS_S3_UPLOAD_ENABLED: "${AWS_S3_UPLOAD_ENABLED:-false}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-guia-despacho-ssaezv-dcn}"
    expose: ["8082"]
    volumes:
      - inscripciones-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [eft-network]

  bff-service:
    image: "${DOCKERHUB_USERNAME:?Defina DOCKERHUB_USERNAME en .env.ec2}/eft-cursos-bff:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      cursos-service:
        condition: service_healthy
      inscripciones-service:
        condition: service_healthy
    environment:
      <<: *common-security
      CURSOS_SERVICE_URL: http://cursos-service:8081
      INSCRIPCIONES_SERVICE_URL: http://inscripciones-service:8082
      FRONTEND_ALLOWED_ORIGIN: "${FRONTEND_ALLOWED_ORIGIN:?Defina FRONTEND_ALLOWED_ORIGIN en .env.ec2}"
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [eft-network]

  frontend:
    image: "${DOCKERHUB_USERNAME:?Defina DOCKERHUB_USERNAME en .env.ec2}/eft-cursos-frontend:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      bff-service:
        condition: service_healthy
    environment:
      B2C_CLIENT_ID: "${B2C_CLIENT_ID:?Defina B2C_CLIENT_ID en .env.ec2}"
      B2C_AUTHORITY: "${B2C_AUTHORITY:?Defina B2C_AUTHORITY en .env.ec2}"
      B2C_KNOWN_AUTHORITY: "${B2C_KNOWN_AUTHORITY:?Defina B2C_KNOWN_AUTHORITY en .env.ec2}"
      B2C_REDIRECT_URI: "${B2C_REDIRECT_URI:?Defina B2C_REDIRECT_URI en .env.ec2}"
      B2C_SCOPE: "${B2C_SCOPE:?Defina B2C_SCOPE en .env.ec2}"
      BFF_BASE_URL: "${BFF_BASE_URL:-}"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [eft-network]

networks:
  eft-network:
    driver: bridge

volumes:
  rabbit-data:
  cursos-data:
  inscripciones-data:
