spring.application.name=guia-despacho

spring.datasource.url=jdbc:h2:mem:guiadespacho
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.storage.efs-path=${APP_EFS_PATH:./efs/guias}
app.aws.s3.bucket=${AWS_S3_BUCKET:guia-despacho-bucket}
app.aws.region=${AWS_REGION:us-east-1}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}
app.security.jwk-set-uri=${AZURE_JWK_SET_URI}
app.security.audience=${AZURE_CLIENT_ID}
app.security.roles-claim=${AZURE_ROLES_CLAIM:extension_RolGuia}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
